<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة الأفلام والأنمي</title>
    <style>
      :root {
        --primary-color: #38bdf8;
        --bg-color: #0b0f19;
        --card-bg: #161e2e;
        --text-color: #ffffff;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body { 
        background-color: var(--bg-color); 
        color: var(--text-color); 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        padding: 20px; 
      }
      
      header {
        text-align: center;
        margin-bottom: 30px;
      }

      h1 {
        font-size: 2.2rem;
        color: var(--primary-color);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      /* شبكة الكروت (Grid) */
      .movies-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }

      /* كارت الفيلم */
      .movie-card {
        background: var(--card-bg);
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #2a3447;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        display: flex;
        flex-direction: column;
      }

      .movie-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(56, 189, 248, 0.2);
      }

      /* بوستر الفيلم */
      .poster-container {
        width: 100%;
        height: 300px;
        overflow: hidden;
        background: #000;
      }

      .poster-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s ease;
      }

      .movie-card:hover .poster-container img {
        transform: scale(1.05);
      }

      /* التفاصيل والعنوان */
      .movie-info {
        padding: 15px;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
        justify-content: space-between;
        gap: 12px;
        text-align: center;
      }

      .movie-title {
        font-size: 1.1rem;
        font-weight: bold;
        color: #fff;
      }

      .watch-btn { 
        background: var(--primary-color); 
        color: #000; 
        padding: 10px 15px; 
        border-radius: 6px; 
        text-decoration: none; 
        font-weight: bold; 
        display: block;
        transition: 0.2s ease;
        text-align: center;
      }

      .watch-btn:hover { 
        background: #fff; 
        color: #000;
      }

      /* 📱 الموبايل */
      @media (max-width: 600px) {
        .movies-grid {
          grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
          gap: 12px;
        }
        .poster-container {
          height: 220px;
        }
        .movie-title {
          font-size: 0.95rem;
        }
        .watch-btn {
          padding: 8px 10px;
          font-size: 0.85rem;
        }
      }
    </style>
  </head>
  <body>

    <header>
      <h1>مكتبة الأفلام <span id="device-icon">🎬</span></h1>
    </header>

    <div class="movies-grid">
        
        <!-- كارت فيلم 1 -->
        <div class="movie-card">
            <div class="poster-container">
            <img src="https://lumiere-a.akamaihd.net/v1/images/p_thegooddinosaur_19753_03c2af0a.jpeg?region=0%2C0%2C540%2C810" alt="The Good Dinosaur">
            </div>
            <div class="movie-info">
                <span class="movie-title">The Good Dinosaur</span>
                <a href="https://youtu.be/SdYtziMNUZQ" target="_blank" class="watch-btn">مشاهدة</a>
            </div>
        </div>

        <!-- كارت فيلم 2 -->
        <div class="movie-card">
            <div class="poster-container">
                <img src="https://lumiere-a.akamaihd.net/v1/images/p_insideout_19751_af12286c.jpeg" alt="Inside Out 1">
            </div>
            <div class="movie-info">
                <span class="movie-title">Inside Out 1</span>
                <a href="https://youtu.be/uxEFgCaxwFA" target="_blank" class="watch-btn">مشاهدة </a>
            </div>
        </div>

        <!-- كارت فيلم 3 -->
        <div class="movie-card">
            <div class="poster-container">
                <img src="https://m.media-amazon.com/images/S/pv-target-images/7390f647a1edb3cd152bda26e4b57a3be4e96dc603af64519a79273ab9850cd6.jpg" alt="Inside Out 2">
            </div>
            <div class="movie-info">
                <span class="movie-title">Inside Out 2</span>
                <a href="https://youtu.be/KWkq3bYhpHc" target="_blank" class="watch-btn">مشاهدة </a>
            </div>
        </div>

    </div>

    <script>
      function adaptIconOnly() {
        const userAgent = navigator.userAgent.toLowerCase();
        const icon = document.getElementById('device-icon');
        
        if (/iphone|ipad|ipod/.test(userAgent)) {
          icon.innerText = "🍏🎬";
        } else if (/android/.test(userAgent)) {
          icon.innerText = "🤖🎬";
        } else {
          icon.innerText = "💻🎬";
        }
      }
      window.onload = adaptIconOnly;
    </script>
  </body>
</html>
