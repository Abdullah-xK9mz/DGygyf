<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>طابق الإيموجي | تدريب الذاكرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0c10;
    --panel: #12151c;
    --panel-line: #232833;
    --ink: #e7ebf2;
    --ink-dim: #8892a0;
    --pink: #ff3d7f;
    --pink-dim: #3d1526;
    --cyan: #3ec9d6;
    --cyan-dim: #14343a;
    --win: #52d17c;
    --card-back-1: #1a2130;
    --card-back-2: #232c40;
    --card-front: #171b24;
  }

  [data-theme="light"]{
    --bg: #eef1f6;
    --panel: #ffffff;
    --panel-line: #e0e4ec;
    --ink: #1b2130;
    --ink-dim: #6b7280;
    --pink: #ff3d7f;
    --pink-dim: #ffd9e6;
    --cyan: #0891a8;
    --cyan-dim: #d3f2f6;
    --win: #1a9c56;
    --card-back-1: #0fb8cc;
    --card-back-2: #14d6c4;
    --card-front: #ffffff;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 10% 0%, rgba(255,61,127,0.08), transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(62,201,214,0.08), transparent 40%);
    color: var(--ink);
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 50px 14px 34px;
    transition: background 0.3s, color 0.3s;
    -webkit-tap-highlight-color: transparent;
  }

  .mono{ font-family: 'JetBrains Mono', monospace; }

  /* ===== theme toggle ===== */
  .theme-btn{
    position: fixed;
    top: 14px;
    left: 14px;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--panel-line);
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    font-size: 12.5px;
    display:flex;
    align-items:center;
    gap:6px;
    z-index: 10;
    transition: 0.2s;
  }
  .theme-btn:hover{ border-color: var(--cyan); }

  /* ===== header ===== */
  .eyebrow{
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--ink-dim);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  h1{
    font-size: clamp(22px, 5vw, 30px);
    font-weight: 700;
    margin: 0 0 18px;
    text-align:center;
    letter-spacing: -0.5px;
  }
  h1 span{ color: var(--pink); }

  /* ===== stats + difficulty row ===== */
  .hud{
    display:flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content:center;
    margin-bottom: 20px;
  }

  .stat-pill{
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 12px;
    padding: 10px 18px;
    display:flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--ink-dim);
  }

  .stat-pill b{
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 700;
  }

  .stat-moves b{ color: var(--cyan); }
  .stat-matches b{ color: var(--pink); }

  .select-wrap{
    position: relative;
  }

  select{
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--panel-line);
    padding: 10px 16px;
    font-size: 13px;
    font-family: inherit;
    font-weight: 600;
    border-radius: 12px;
    outline: none;
    cursor: pointer;
    appearance: none;
    padding-left: 30px;
  }
  select:focus{ border-color: var(--cyan); }

  .select-wrap::after{
    content: "▾";
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-dim);
    pointer-events: none;
    font-size: 12px;
  }

  /* ===== grid ===== */
  .game-grid{
    display: grid;
    gap: 9px;
    width: 100%;
    max-width: 460px;
    perspective: 1000px;
    margin-bottom: 22px;
  }

  .card{
    aspect-ratio: 1 / 1;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(.4,0,.2,1);
    cursor: pointer;
  }

  .card.flipped{ transform: rotateY(180deg); }

  .card-face{
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 1.7rem;
    border: 1px solid var(--panel-line);
  }

  @media (max-width: 400px){
    .card-face{ font-size: 1.35rem; }
  }

  .card-back{
    background: linear-gradient(145deg, var(--card-back-1), var(--card-back-2));
    color: var(--cyan);
    box-shadow: 0 3px 10px rgba(0,0,0,0.25);
  }
  .card-back::after{
    content: "?";
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    opacity: 0.55;
  }

  .card-front{
    background: var(--card-front);
    border-color: var(--pink);
    transform: rotateY(180deg);
    box-shadow: 0 0 0 1px var(--pink) inset;
  }

  .card.matched .card-front{
    border-color: var(--win);
    box-shadow: 0 0 0 1px var(--win) inset;
    opacity: 0.55;
  }

  /* ===== buttons ===== */
  .actions{
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    max-width: 460px;
  }

  .btn-nav-back {
    flex: 1;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--panel-line);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-decoration: none;
  }

  .btn-nav-back:hover {
    border-color: var(--cyan);
    background: var(--panel-line);
  }

  #reset-btn{
    padding: 12px 30px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    background: transparent;
    color: var(--pink);
    border: 2px solid var(--pink);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.25s;
  }
  #reset-btn:hover{
    background: var(--pink);
    color: #1a0510;
  }

  .back-btn{
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    transition: 0.2s;
  }
  .back-btn:hover{ color: var(--ink); }

  /* ===== win overlay ===== */
  #winOverlay{
    display:none;
    position: fixed;
    inset:0;
    background: rgba(6,7,10,0.92);
    backdrop-filter: blur(6px);
    z-index: 999;
    justify-content:center;
    align-items:center;
    flex-direction: column;
    padding: 24px;
    text-align:center;
  }
  #winOverlay h2{
    font-size: clamp(24px, 6vw, 34px);
    color: var(--win);
    margin: 0 0 10px;
  }
  #winOverlay p{
    font-size: 15px;
    color: var(--ink-dim);
    margin: 0 0 26px;
    max-width: 320px;
  }
  #winOverlay p b{
    color: var(--cyan);
    font-family: 'JetBrains Mono', monospace;
  }
  .win-btn{
    background: var(--cyan);
    color: #04202a;
    border:none;
    padding: 13px 28px;
    border-radius: 10px;
    font-family: inherit;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  .win-btn:hover{ filter: brightness(1.1); }
</style>
</head>
<body>


  <div id="winOverlay">
    <h2>🏆 عاش يا وحش!</h2>
    <p id="winDesc"></p>
    <button class="win-btn" onclick="closeWin()">جولة جديدة 🔄</button>
  </div>

  <div class="eyebrow">تدريب الذاكرة البصرية</div>
  <h1>طابق <span>الإيموجي</span> 🧠</h1>

  <div class="hud">
    <div class="stat-pill stat-moves">المحاولات <b id="moves-count">0</b></div>
    <div class="stat-pill stat-matches">الأزواج <b id="match-count">0</b>/<b class="mono" id="total-pairs">10</b></div>
    <div class="select-wrap">
      <select id="difficulty" onchange="resetGame()">
        <option value="easy" selected>سهل (4×5) 🥱</option>
        <option value="medium">متوسط (5×6) 🤔</option>
        <option value="hard">صعب (6×6) 🔥</option>
      </select>
    </div>
  </div>

  <div class="game-grid" id="grid"></div>

  <div class="actions">
    <button class="btn-nav-back" onclick="resetGame()">جولة جديدة 🔄</button>
    <a href="games.html" class="btn-nav-back">الألعاب 🎮</a>
  </div>

<script>
  const gridElement = document.getElementById('grid');
  const movesElement = document.getElementById('moves-count');
  const matchElement = document.getElementById('match-count');
  const totalPairsElement = document.getElementById('total-pairs');
  const difficultySelect = document.getElementById('difficulty');

  const allEmojis = [
    '🐱', '🎮', '🚀', '🔥', '💎', '👻', '👑', '🦁', '🦊', '🍕',
    '🍔', '🎨', '⚽', '🎸', '🪐', '🦄', '🍿', '🎬', '⚡', '🤖'
  ];

  let cardsArray = [];
  let flippedCards = [];
  let matchedPairs = 0;
  let moves = 0;
  let lockBoard = false;
  let targetPairs = 10;

  function toggleTheme(){
    const current = document.documentElement.getAttribute('data-theme');
    if(current === 'light'){
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  }

  function shuffle(array){
    for(let i = array.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function setupDifficulty(){
    const level = difficultySelect.value;
    let rows, cols;

    if(level === 'easy'){ rows = 4; cols = 5; }
    else if(level === 'medium'){ rows = 5; cols = 6; }
    else { rows = 6; cols = 6; }

    targetPairs = (rows * cols) / 2;
    totalPairsElement.innerText = targetPairs;

    gridElement.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

    const selectedEmojis = allEmojis.slice(0, targetPairs);
    cardsArray = [...selectedEmojis, ...selectedEmojis];
  }

  function createBoard(){
    gridElement.innerHTML = '';
    setupDifficulty();
    shuffle(cardsArray);

    cardsArray.forEach((emoji, index) => {
      const card = document.createElement('div');
      card.classList.add('card');
      card.setAttribute('data-emoji', emoji);
      card.setAttribute('data-index', index);

      card.innerHTML = `
        <div class="card-face card-back"></div>
        <div class="card-face card-front">${emoji}</div>
      `;

      card.addEventListener('click', flipCard);
      gridElement.appendChild(card);
    });
  }

  function flipCard(){
    if(lockBoard) return;
    if(this === flippedCards[0]) return;

    this.classList.add('flipped');
    flippedCards.push(this);

    if(flippedCards.length === 2){
      moves++;
      movesElement.innerText = moves;
      checkMatch();
    }
  }

  function checkMatch(){
    const [card1, card2] = flippedCards;
    const isMatch = card1.getAttribute('data-emoji') === card2.getAttribute('data-emoji');

    if(isMatch){
      disableCards();
    } else {
      unflipCards();
    }
  }

  function disableCards(){
    flippedCards[0].removeEventListener('click', flipCard);
    flippedCards[1].removeEventListener('click', flipCard);
    flippedCards[0].classList.add('matched');
    flippedCards[1].classList.add('matched');

    matchedPairs++;
    matchElement.innerText = matchedPairs;

    resetTurn();

    if(matchedPairs === targetPairs){
      setTimeout(() => {
        document.getElementById('winDesc').innerHTML =
          `خلصت المستوى بنجاح في <b>${moves}</b> محاولة!`;
        document.getElementById('winOverlay').style.display = 'flex';
      }, 500);
    }
  }

  function unflipCards(){
    lockBoard = true;
    setTimeout(() => {
      flippedCards[0].classList.remove('flipped');
      flippedCards[1].classList.remove('flipped');
      resetTurn();
    }, 900);
  }

  function resetTurn(){
    flippedCards = [];
    lockBoard = false;
  }

  function closeWin(){
    document.getElementById('winOverlay').style.display = 'none';
    resetGame();
  }

  function resetGame(){
    moves = 0;
    matchedPairs = 0;
    movesElement.innerText = '0';
    matchElement.innerText = '0';
    flippedCards = [];
    lockBoard = false;
    createBoard();
  }

  window.onload = createBoard;
</script>
</body>
</html>
