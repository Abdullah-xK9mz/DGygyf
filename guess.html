<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تحدي تخمين الرقم Pro 🔢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --panel: #12151cdd;
    --panel-line: #232833;
    --ink: #e7ebf2;
    --ink-dim: #8892a0;
    --amber: #f2b134;
    --cyan: #3ec9d6;
    --pink: #ff3d7f;
    --win: #52d17c;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0; padding: 0;
    background-color: #0a0c10;
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    user-select: none;
    padding: 15px;
  }

  .game-card{
    background: #161b26;
    border: 1px solid var(--panel-line);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    text-align: center;
  }

  h1{ font-size: 1.4rem; color: var(--amber); margin-top: 0; }
  
  .status-badge{
    background: var(--panel-line);
    color: var(--cyan);
    padding: 8px 16px;
    border-radius: 99px;
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 20px;
    display: inline-block;
  }

  .range-box{
    background: #0d1117;
    border: 1px dashed var(--cyan);
    padding: 12px;
    border-radius: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem;
    margin-bottom: 20px;
  }

  .input-group{
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 15px;
  }

  input[type="number"]{
    background: #0d1117;
    border: 1px solid var(--panel-line);
    color: #fff;
    padding: 12px;
    border-radius: 10px;
    width: 100px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.2rem;
    outline: none;
  }
  input[type="number"]:focus{ border-color: var(--amber); }

  button{
    background: var(--amber);
    color: #1a1204;
    border: none;
    padding: 12px 24px;
    font-family: inherit;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover{ filter: brightness(1.1); }
  button:disabled{ opacity: 0.4; cursor: not-allowed; }

  .log-list{
    background: #0d1117;
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    height: 120px;
    overflow-y: auto;
    padding: 10px;
    font-size: 0.85rem;
    text-align: right;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .log-item{ padding: 4px 8px; border-radius: 4px; }
  .log-player{ background: rgba(62, 201, 214, 0.1); color: var(--cyan); }
  .log-comp{ background: rgba(255, 61, 127, 0.1); color: var(--pink); }

  /* Overlay */
  .overlay{
    position: fixed; inset: 0; background: rgba(5,6,10,0.9);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 50; padding: 20px; text-align: center;
  }
</style>
</head>
<body>

<div class="game-card">
  <h1>🎯 سباق التخمين السري</h1>
  <div class="status-badge" id="status">الهدف: قفش رقم الكمبيوتر قبل ما يسبقك!</div>

  <div class="range-box">
    الرقم محصور بين: <span id="minRange" style="color:var(--amber);">1</span> و <span id="maxRange" style="color:var(--amber);">100</span>
  </div>

  <div class="input-group">
    <input type="number" id="userGuess" placeholder="00" min="1" max="100">
    <button id="guessBtn" onclick="makeGuess()">تخمين 🚀</button>
  </div>

  <div class="log-list" id="logList">
    <div style="color: var(--ink-dim); text-align: center;">السجل هيظهر هنا..</div>
  </div>

  <button style="margin-top: 15px; background: transparent; color: var(--ink-dim); border: 1px solid var(--panel-line);" onclick="initGame()">إعادة اللعب 🔄</button>
</div>

<div class="overlay" id="winOverlay">
  <h2 id="winTitle" style="font-size: 2rem; margin-bottom: 10px;"></h2>
  <p id="winDesc" style="color: var(--ink-dim); margin-bottom: 20px;"></p>
  <button onclick="initGame()" style="font-size: 1.1rem; padding: 12px 30px;">جولة جديدة 🎮</button>
</div>

<script>
  let targetNumber, min, max, isPlayerTurn;

  function initGame() {
    targetNumber = Math.floor(Math.random() * 100) + 1;
    min = 1;
    max = 100;
    isPlayerTurn = true;

    document.getElementById('minRange').innerText = min;
    document.getElementById('maxRange').innerText = max;
    document.getElementById('logList').innerHTML = '';
    document.getElementById('userGuess').value = '';
    document.getElementById('winOverlay').style.display = 'none';
    document.getElementById('guessBtn').disabled = false;
    document.getElementById('status').innerText = "دورك أنت: ادخل رقمك وركز!";
  }

  function addLog(text, type) {
    const logList = document.getElementById('logList');
    const item = document.createElement('div');
    item.className = `log-item ${type === 'player' ? 'log-player' : 'log-comp'}`;
    item.innerText = text;
    logList.prepend(item);
  }

  function makeGuess() {
    if (!isPlayerTurn) return;

    const input = document.getElementById('userGuess');
    const val = parseInt(input.value);

    if (isNaN(val) || val < min || val > max) return;

    if (val === targetNumber) {
      endGame(true, "عاش يا بطل! قدرت تقفش الرقم السري قبل الكمبيوتر! 🏆");
      return;
    }

    if (val < targetNumber) {
      min = Math.max(min, val + 1);
      addLog(`🧑 أنت خمنت ${val} (الرقم السري أكبر ⬆️)`, 'player');
    } else {
      max = Math.min(max, val - 1);
      addLog(`🧑 أنت خمنت ${val} (الرقم السري أصغر ⬇️)`, 'player');
    }

    updateUI();
    isPlayerTurn = false;
    document.getElementById('guessBtn').disabled = true;
    document.getElementById('status').innerText = "🤖 الكمبيوتر يفكر...";

    setTimeout(computerTurn, 1200);
  }

  function computerTurn() {
    // الذكاء الاصطناعي يخمن بشرياً (ليس binary search مثالي دائماً ليترك مجال للمنافسة)
    let compGuess;
    const smartChoice = Math.random() < 0.7; // 70% نسبة ذكاء

    if (smartChoice) {
      compGuess = Math.floor((min + max) / 2);
    } else {
      compGuess = Math.floor(Math.random() * (max - min + 1)) + min;
    }

    if (compGuess === targetNumber) {
      endGame(false, `الكمبيوتر قفش الرقم السري (${targetNumber}) وسبقك المرة دي! 💥`);
      return;
    }

    if (compGuess < targetNumber) {
      min = Math.max(min, compGuess + 1);
      addLog(`🤖 الكمبيوتر خمن ${compGuess} (الرقم السري أكبر ⬆️)`, 'comp');
    } else {
      max = Math.min(max, compGuess - 1);
      addLog(`🤖 الكمبيوتر خمن ${compGuess} (الرقم السري أصغر ⬇️)`, 'comp');
    }

    updateUI();
    isPlayerTurn = true;
    document.getElementById('guessBtn').disabled = false;
    document.getElementById('status').innerText = "دورك أنت: خمن الرقم الجديد!";
  }

  function updateUI() {
    document.getElementById('minRange').innerText = min;
    document.getElementById('maxRange').innerText = max;
    document.getElementById('userGuess').value = '';
  }

  function endGame(playerWon, desc) {
    const overlay = document.getElementById('winOverlay');
    const title = document.getElementById('winTitle');
    const winDesc = document.getElementById('winDesc');

    title.innerText = playerWon ? "🎉 فوز ساحق!" : "💥 جيم أوفر!";
    title.style.color = playerWon ? "var(--win)" : "var(--pink)";
    winDesc.innerText = desc;

    overlay.style.display = 'flex';
  }

  initGame();
</script>
</body>
</html>
