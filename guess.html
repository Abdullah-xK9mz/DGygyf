<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <!-- السطر السحري عشان الموبايل يقرأ الأبعاد الحقيقية للشاشة -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي تخمين الرقم</title>
    <style>
      body {
        background-color: #121212; 
        color: white; 
        text-align: center; 
        font-family: sans-serif; 
        padding: 15px; 
        overflow-x: hidden;
        margin: 0;
      }

      /* تنسيق ذكي لشاشة الاحتفال الكبرى لتناسب الموبايل */
      #celebration {
        display: none; 
        position: fixed; 
        top: 0; left: 0; 
        width: 100%; height: 100%; 
        background: rgba(0,0,0,0.9); 
        z-index: 999; 
        justify-content: center; 
        align-items: center; 
        flex-direction: column;
        padding: 20px;
        box-sizing: border-box;
      }

      #winTitle {
        font-size: 36px; /* مقاس مرن للموبايل والكمبيوتر */
        color: #28a745; 
        text-shadow: 0 0 20px #28a745;
        text-align: center;
        margin-bottom: 10px;
      }

      #winDesc {
        font-size: 18px; 
        color: white; 
        margin-bottom: 30px;
        text-align: center;
        max-width: 400px;
      }

      /* الصناديق الأساسية */
      .game-box {
        background: #1e1e1e; 
        padding: 20px; 
        width: 300px; 
        border-radius: 10px; 
        transition: 0.3s;
        box-sizing: border-box;
      }

      /* 📱 التعديل السحري للموبايل تلقائياً */
      @media (max-width: 680px) {
        h1 { font-size: 1.5rem; }
        #turnIndicator { font-size: 15px; width: 90%; box-sizing: border-box; }
        
        /* الصناديق تملأ العرض المتاح وتنزل تحت بعض */
        .game-box {
          width: 100%; 
          max-width: 340px;
        }
        
        #winTitle { font-size: 28px; }
        #winDesc { font-size: 16px; }
      }
    </style>
</head>
<body>

    <div id="celebration">
        <h1 id="winTitle">🎉 فوز ساحق! 🎉</h1>
        <h2 id="winDesc"></h2>
        <button onclick="closeCelebration()" style="padding: 15px 30px; background: #e0a800; color: black; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; font-size: 18px;">العب جيم جديد 🔄</button>
    </div>

    <h1>🤖 تحدي الذكاء المتناوب: أنت ضد الكمبيوتر 🧑</h1>
    
    <div id="turnIndicator" style="background: #222; padding: 10px; display: inline-block; border-radius: 20px; font-weight: bold; font-size: 18px; border: 2px solid #00d2ff; margin-bottom: 15px; color: #00d2ff;">
        🔴 البداية عندك: خمن رقم الكمبيوتر الأول
    </div>

    <br>
    <button onclick="resetGame()" style="padding: 10px 20px; background: #555; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; margin-bottom: 15px;">إعادة بدء وتصفير 🔄</button>

    <hr style="border: 1px solid #333; width: 90%;">

    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 10px; padding: 0 10px;">
        
        <!-- صندوق اللاعب -->
        <div id="playerBox" class="game-box" style="border: 2px solid #28a745;">
            <h3>🧑 دورك أنت</h3>
            <p style="font-size: 13px; color: #aaa;">خمن رقم الكمبيوتر السري (1-100)</p>
            <div style="display: flex; justify-content: center; gap: 10px; align-items: center; margin-top: 15px;">
                <input type="number" id="userGuess" placeholder="رقم" style="padding: 10px; width: 80px; text-align: center; font-size: 16px; border-radius: 5px; border: none;">
                <button id="playerBtn" onclick="playerTurn()" style="padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 16px;">خمن!</button>
            </div>
            <p id="playerMessage" style="color: #ffc107; font-weight: bold; min-height: 40px; margin-top: 15px;"></p>
        </div>

        <!-- صندوق الكمبيوتر -->
        <div id="compBox" class="game-box" style="border: 2px solid #555; opacity: 0.5;">
            <h3>🤖 دور الكمبيوتر</h3>
            <p style="font-size: 13px; color: #aaa;">الكمبيوتر بيحاول يقفش الرقم اللي في دماغك</p>
            
            <h3 id="compGuessDisplay" style="color: #00d2ff; min-height: 30px;">---</h3>
            
            <div id="feedbackBtns" style="display: none; justify-content: center; flex-direction: column; gap: 8px; margin-top: 15px;">
                <button onclick="compFeedback('low')" style="padding: 10px; background: #ffc107; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; font-size: 15px;">رقمي أكبر ☝️</button>
                <button onclick="compFeedback('correct')" style="padding: 10px; background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; font-size: 15px;">صح هو ده رقمي!🎯</button>
                <button onclick="compFeedback('high')" style="padding: 10px; background: #dc3545; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; font-size: 15px;">رقمي أصغر 👇</button>
            </div>
            <p id="compMessage" style="color: #ffc107; font-weight: bold; min-height: 40px; margin-top: 15px;"></p>
        </div>

    </div>

    <script>
        let compSecretNumber, min, max, compGuess, currentTurn;

        function resetGame() {
            compSecretNumber = Math.floor(Math.random() * 100) + 1;
            min = 1;
            max = 100;
            compGuess = 0;
            currentTurn = 'player';

            document.getElementById("userGuess").value = "";
            document.getElementById("playerMessage").innerHTML = "";
            document.getElementById("compGuessDisplay").innerHTML = "---";
            document.getElementById("compMessage").innerHTML = "";
            document.getElementById("feedbackBtns").style.display = "none";
            
            updateTurnUI();
        }

        function updateTurnUI() {
            let pBox = document.getElementById("playerBox");
            let cBox = document.getElementById("compBox");
            let pBtn = document.getElementById("playerBtn");
            let pInput = document.getElementById("userGuess");
            let indicator = document.getElementById("turnIndicator");

            if (currentTurn === 'player') {
                indicator.innerHTML = "🟢 دورك أنت: خمن رقم الكمبيوتر";
                indicator.style.borderColor = "#28a745";
                indicator.style.color = "#28a745";
                
                pBox.style.opacity = "1";
                pBox.style.borderWidth = "2px";
                pBtn.disabled = false;
                pInput.disabled = false;

                cBox.style.opacity = "0.4";
                cBox.style.borderWidth = "0px";
                document.getElementById("feedbackBtns").style.display = "none";
            } else {
                indicator.innerHTML = "🤖 دور الكمبيوتر: جاوب على تخمينه بالزراير";
                indicator.style.borderColor = "#00d2ff";
                indicator.style.color = "#00d2ff";

                pBox.style.opacity = "0.4";
                pBox.style.borderWidth = "0px";
                pBtn.disabled = true;
                pInput.disabled = true;

                cBox.style.opacity = "1";
                cBox.style.borderWidth = "2px";
                cBox.style.borderColor = "#00d2ff";
                
                setTimeout(compThinkAndGuess, 1000);
            }
        }

        function playerTurn() {
            let guess = document.getElementById("userGuess").value;
            let msg = document.getElementById("playerMessage");

            if (!guess) { return; }

            if (guess == compSecretNumber) {
                triggerWin('player', "أنت قفشت رقم الكمبيوتر العشوائي وغلبت الذكاء الاصطناعي! 😎🔥");
            } else {
                if (guess > compSecretNumber) {
                    msg.innerHTML = "⬇️ رقمك كبير! رقم الكمبيوتر أصغر.";
                } else {
                    msg.innerHTML = "⬆️ رقمك صغير! رقم الكمبيوتر أكبر.";
                }
                setTimeout(() => {
                    currentTurn = 'comp';
                    updateTurnUI();
                }, 1500);
            }
        }

        function compThinkAndGuess() {
            if (min <= max) {
                compGuess = Math.floor((min + max) / 2);
                document.getElementById("compGuessDisplay").innerHTML = "هل رقمك هو: <span style='font-size:24px; color:#fff;'>" + compGuess + "</span> ؟";
                document.getElementById("feedbackBtns").style.display = "flex";
            } else {
                document.getElementById("compGuessDisplay").innerHTML = " 😂 قفشتك!";
                document.getElementById("compMessage").innerHTML = "🤔 أنت بتغش عليا! حساباتي بتقول إنك غيرت رقمك في نص الجيم!";
            }
        }

        function compFeedback(status) {
            if (status === 'correct') {
                triggerWin('comp', "الكمبيوتر قفش رقمك بذكائه الرياضي! هارد لك يا بطل 🤖🦾");
            } else {
                if (status === 'low') {
                    min = compGuess + 1;
                } else if (status === 'high') {
                    max = compGuess - 1;
                }
                document.getElementById("compMessage").innerHTML = "تخمين الكمبيوتر مسجل.. جاري نقل الدور إليك.";
                setTimeout(() => {
                    document.getElementById("compMessage").innerHTML = "";
                    currentTurn = 'player';
                    updateTurnUI();
                }, 1200);
            }
        }

        function triggerWin(winner, description) {
            let screen = document.getElementById("celebration");
            let title = document.getElementById("winTitle");
            let desc = document.getElementById("winDesc");

            if (winner === 'player') {
                title.innerHTML = "🎉 مبروووك! أنت الكسبان والملِك 👑🏆";
                title.style.color = "#28a745";
            } else {
                title.innerHTML = "🤖 الكمبيوتر كسب المرة دي! 💥";
                title.style.color = "#dc3545";
            }

            desc.innerHTML = description;
            screen.style.display = "flex";
        }

        function closeCelebration() {
            document.getElementById("celebration").style.display = "none";
            resetGame();
        }

        resetGame();
    </script>
</body>
</html>
