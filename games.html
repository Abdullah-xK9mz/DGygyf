<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبه🎮</title>
<title>صالة الألعاب 🎮</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0c10;
    --panel: #12151c;
    --panel-line: #232833;
    --ink: #e7ebf2;
    --ink-dim: #8892a0;
    --cyan: #3ec9d6;
    --pink: #ff3d7f;
    --amber: #f2b134;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 12% 0%, rgba(62,201,214,0.09), transparent 40%),
      radial-gradient(circle at 88% 100%, rgba(255,61,127,0.08), transparent 40%);
    color: var(--ink);
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
  }

  .eyebrow{
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--ink-dim);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  h2{
    margin: 0 0 32px;
    font-size: clamp(22px, 5vw, 28px);
    font-weight: 700;
    color: var(--ink);
    text-align: center;
  }
  h2 span{ color: var(--cyan); }

  .menu-container{
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 320px;
  }

  .menu-btn{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    color: var(--ink);
    padding: 16px 20px;
    text-decoration: none;
    border-radius: 14px;
    font-weight: 700;
    font-size: 15px;
    transition: all 0.25s ease;
  }

  .menu-btn:hover{
    background: #171b24;
    border-color: var(--cyan);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px -8px rgba(62,201,214,0.35);
  }

  .menu-btn:active{ transform: translateY(0); }

  .back-link{
    margin-top: 28px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--pink);
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    transition: opacity 0.2s;
  }
  .back-link:hover{ opacity: 0.75; }
</style>
</head>
<body>

  <div class="eyebrow">اختر تحديك</div>
  <h2>صالة <span>الألعاب</span> 🕹️</h2>

  <div class="menu-container">
    <a href="guess.html" class="menu-btn">لعبة تخمين الأرقام 📝🔢</a>
    <a href="memory.html" class="menu-btn">لعبة كروت الذاكرة 🧠</a>
    <a href="ox.html" class="menu-btn">لعبة إكس أو ❌⭕</a>
    <a href="flappy.html" class="menu-btn">الطائر المغامر 🐦</a>
    <a href="space_shooter.html" class="menu-btn">حرب الفضاء اللانهائية 🚀⚡</a>
  </div>

  <a href="index.html" class="back-link">➡️ الصفحة الرئيسية</a>

</body>
</html>
