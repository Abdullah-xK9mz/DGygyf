<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الطائر المغامر Pro 🐦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --panel: #12151cdd;
    --panel-line: #232833;
    --ink: #e7ebf2;
    --ink-dim: #8892a0;
    --amber: #f2b134;
    --cyan: #3ec9d6;
    --pink: #ff3d7f;
    --win: #52d17c;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0; padding: 0;
    background-color: #0a0c10;
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    overflow: hidden;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; width: 100vw;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .mono{ font-family: 'JetBrains Mono', monospace; }

  #game-container{
    width: 100%; height: 100%;
    background: linear-gradient(to bottom, #38bdf8, #bae6fd);
    position: relative;
    overflow: hidden;
  }

  /* ===== HUD ===== */
  .score-board{
    position: absolute;
    top: 18px; left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    backdrop-filter: blur(6px);
    border: 1px solid var(--panel-line);
    border-radius: 999px;
    padding: 8px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--amber);
    z-index: 5;
  }

  .pause-btn{
    position: absolute;
    top: 14px;
    right: 14px;
    background: var(--panel);
    backdrop-filter: blur(6px);
    color: var(--ink);
    border: 1px solid var(--panel-line);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    transition: 0.2s;
  }
  .pause-btn:hover{ border-color: var(--cyan); }

  /* ===== bird ===== */
  #bird{
    width: 42px; height: 32px;
    background: linear-gradient(160deg, #ffd76a, var(--amber) 70%);
    border: 2px solid #b8790f;
    border-radius: 50%;
    position: absolute;
    left: 15%; top: 40%;
    z-index: 3;
    transition: transform 0.12s ease;
    box-shadow: 0 3px 10px rgba(0,0,0,0.2);
  }
  #bird::before{
    content: '';
    position: absolute;
    top: 6px; right: 9px;
    width: 6px; height: 6px;
    background-color: #1a1204;
    border-radius: 50%;
  }
  #bird::after{
    content: '';
    position: absolute;
    top: 10px; right: -10px;
    width: 0; height: 0;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    border-left: 12px solid var(--pink);
  }

  /* ===== pipes ===== */
  .pipe{
    width: 65px;
    background-color: #eab308;
    border: 3px solid #ca8a04;
    box-sizing: border-box;
    position: absolute;
    z-index: 2;
    background-image: linear-gradient(90deg, transparent 50%, rgba(202,138,4,0.3) 50%),
                      linear-gradient(rgba(202,138,4,0.3) 50%, transparent 50%);
    background-size: 15px 15px;
  }

  /* ===== message overlay ===== */
  #msg-screen{
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-color: rgba(5,6,10,0.82);
    backdrop-filter: blur(6px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
    z-index: 10;
  }

  #msg-screen .eyebrow{
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--ink-dim);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  h2{
    font-size: clamp(22px, 6vw, 30px);
    margin: 0 0 12px;
    color: var(--amber);
    font-weight: 700;
  }

  p{
    font-size: 14.5px; max-width: 320px; margin: 0 0 24px;
    direction: rtl; line-height: 1.7; color: var(--ink-dim);
    white-space: pre-line;
  }
  p b{ color: var(--cyan); font-family: 'JetBrains Mono', monospace; }

  .btn-start{
    background: var(--amber);
    color: #1a1204;
    border: none;
    padding: 13px 38px;
    font-size: 15px;
    font-family: inherit;
    font-weight: 700;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(242,177,52,0.3);
    transition: filter 0.2s, transform 0.15s;
  }
  .btn-start:hover{ filter: brightness(1.08); transform: translateY(-1px); }
  .btn-start:active{ transform: translateY(0); }

  /* ===== pause overlay ===== */
  #pauseOverlay{
    display:none;
    position: absolute;
    inset: 0;
    background: rgba(5,6,10,0.88);
    backdrop-filter: blur(6px);
    z-index: 15;
    justify-content:center;
    align-items:center;
    flex-direction: column;
    padding: 24px;
    text-align:center;
  }
  #pauseOverlay h2{ color: var(--cyan); font-size: clamp(20px, 5.5vh, 26px); margin: 0 0 22px; }

  .pause-actions{
    display:flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 260px;
  }
  .pause-actions button,
  .pause-actions a{
    padding: 12px 20px;
    border-radius: 10px;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    text-decoration: none;
    border: none;
  }
  .pause-resume{ background: var(--amber); color: #1a1204; }
  .pause-resume:hover{ filter: brightness(1.1); }
  .pause-link{
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--panel-line) !important;
  }
  .pause-link:hover{ border-color: var(--cyan) !important; }
</style>
</head>
<body>
    <div id="game-container">
        <div class="score-board" id="score-val">0</div>

        <button class="pause-btn" onclick="pauseGame()">⏸</button>

        <div id="pauseOverlay">
          <h2>⏸ توقف مؤقت</h2>
          <div class="pause-actions">
            <button class="pause-resume" onclick="resumeGame()">استمرار ▶️</button>
            <a class="pause-link" href="‏‏games - 1.html">الرجوع لصفحة الألعاب 🎮</a>
          </div>
        </div>

        <div id="msg-screen">
            <div class="eyebrow">تحدي رد الفعل السريع</div>
            <h2 id="msg-title">طير وتحدى أصحابك! 🐦</h2>
            <p id="msg-desc">اضغط على الشاشة أو مسطرة الكيبورد Space لتجعل العصفور يطير.</p>
            <button class="btn-start" id="start-btn" onclick="startGame()">إبدأ اللعب 🎮</button>
        </div>

        <div id="bird"></div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const bird = document.getElementById('bird');
        const scoreVal = document.getElementById('score-val');
        const msgScreen = document.getElementById('msg-screen');
        const msgTitle = document.getElementById('msg-title');
        const msgDesc = document.getElementById('msg-desc');

        let screenWidth = container.clientWidth;
        let screenHeight = container.clientHeight;

        let birdY = screenHeight / 2;
        let velocity = 0;
        let gravity = 0.35;
        const jump = -6.5;

        let score = 0;
        let gameActive = false;
        let pipes = [];
        let gameLoopInterval;
        let pipeGeneratorTimeout;

        let currentSpeed = 3.0;
        let currentGap = 165;
        let spawnRate = 1600;

        let lastTopHeight = null;

        window.addEventListener('resize', () => {
            screenWidth = container.clientWidth;
            screenHeight = container.clientHeight;
        });

        function birdJump(){
            if(!gameActive) return;
            velocity = jump;
            bird.style.transform = "rotate(-25deg)";
        }

        container.addEventListener('touchstart', (e) => {
            e.preventDefault();
            birdJump();
        });
        container.addEventListener('mousedown', (e) => {
            if(e.target.id !== 'start-btn' && !e.target.closest('.pause-btn') && !e.target.closest('#pauseOverlay')) birdJump();
        });
        document.addEventListener('keydown', (e) => {
            if(e.key === ' ' || e.code === 'Space'){
                e.preventDefault();
                birdJump();
            }
        });

        function startGame(){
            birdY = screenHeight / 3;
            velocity = 0;
            score = 0;
            scoreVal.innerText = score;

            currentSpeed = 3.0;
            currentGap = 165;
            spawnRate = 1600;
            lastTopHeight = screenHeight / 3;

            gameActive = true;
            msgScreen.style.display = 'none';

            pipes.forEach(p => p.el.remove());
            pipes = [];

            clearInterval(gameLoopInterval);
            clearTimeout(pipeGeneratorTimeout);

            gameLoopInterval = setInterval(updateGame, 20);
            pipeGeneratorTimeout = setTimeout(createPipePair, 300);
        }

        function createPipePair(){
            if(!gameActive) return;

            const minHeight = 60;
            const maxHeight = screenHeight - currentGap - minHeight;

            let minAllowed = lastTopHeight - 50;
            let maxAllowed = lastTopHeight + 50;

            if(minAllowed < minHeight) minAllowed = minHeight;
            if(maxAllowed > maxHeight) maxAllowed = maxHeight;

            const topHeight = Math.floor(Math.random() * (maxAllowed - minAllowed + 1)) + minAllowed;
            const bottomHeight = screenHeight - currentGap - topHeight;

            lastTopHeight = topHeight;

            const topPipe = document.createElement('div');
            topPipe.classList.add('pipe');
            topPipe.style.height = topHeight + 'px';
            topPipe.style.top = '0px';
            topPipe.style.left = screenWidth + 'px';
            container.appendChild(topPipe);

            const bottomPipe = document.createElement('div');
            bottomPipe.classList.add('pipe');
            bottomPipe.style.height = bottomHeight + 'px';
            bottomPipe.style.bottom = '0px';
            bottomPipe.style.left = screenWidth + 'px';
            container.appendChild(bottomPipe);

            pipes.push(
                { el: topPipe, x: screenWidth, type: 'top', passed: false },
                { el: bottomPipe, x: screenWidth, type: 'bottom', passed: false }
            );

            pipeGeneratorTimeout = setTimeout(createPipePair, spawnRate);
        }

        function updateGame(){
            velocity += gravity;
            birdY += velocity;
            bird.style.top = birdY + 'px';

            if(velocity > 3){
                bird.style.transform = "rotate(35deg)";
            }

            if(birdY < 0 || birdY > (screenHeight - 30)){
                gameOver();
                return;
            }

            const birdLeft = bird.offsetLeft;
            const birdWidth = 40;
            const birdHeight = 30;

            for(let i = pipes.length - 1; i >= 0; i--){
                let p = pipes[i];
                p.x -= currentSpeed;
                p.el.style.left = p.x + 'px';

                if(
                    p.x < (birdLeft + birdWidth) && (p.x + 65) > birdLeft &&
                    ((p.type === 'top' && birdY < parseInt(p.el.style.height)) ||
                     (p.type === 'bottom' && birdY + birdHeight > (screenHeight - parseInt(p.el.style.height))))
                ){
                    gameOver();
                    return;
                }

                if(p.type === 'top' && !p.passed && (p.x + 65) < birdLeft){
                    p.passed = true;
                    score++;
                    scoreVal.innerText = score;

                    if(score % 10 === 0 && score > 0){
                        if(currentSpeed < 5.5) currentSpeed += 0.4;
                        if(currentGap > 125) currentGap -= 8;
                        if(spawnRate > 1200) spawnRate -= 100;
                    }
                }

                if(p.x < -70){
                    p.el.remove();
                    pipes.splice(i, 1);
                }
            }
        }

        function gameOver(){
            gameActive = false;
            clearInterval(gameLoopInterval);
            clearTimeout(pipeGeneratorTimeout);

            msgTitle.innerText = "جيم أوفر! 💥";
            msgTitle.style.color = "#ff3d7f";
            msgDesc.innerHTML = `السكور بتاعك: <b>${score}</b>\n\nكل ما السكور بيزيد، السرعة بتعلى والفتحات بتضيق! وري أصحابك مين أسرع رد فعل!`;
            document.getElementById('start-btn').innerText = "إعادة المحاولة 🔄";
            msgScreen.style.display = 'flex';
        }

        function pauseGame(){
            if(!gameActive) return;
            gameActive = false;
            clearInterval(gameLoopInterval);
            clearTimeout(pipeGeneratorTimeout);
            document.getElementById('pauseOverlay').style.display = 'flex';
        }

        function resumeGame(){
            gameActive = true;
            document.getElementById('pauseOverlay').style.display = 'none';
            gameLoopInterval = setInterval(updateGame, 20);
            pipeGeneratorTimeout = setTimeout(createPipePair, spawnRate);
        }
    </script>

</body>
</html>
