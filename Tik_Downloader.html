<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل بدون علامه مائيه</title>
    <style>
        :root {
            --primary: #0084ff;
            --secondary: #00c6ff;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #3b82f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
        }

        h1 {
            text-align: center;
            color: var(--secondary);
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 61px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #fff;
            padding: 12px;
            box-sizing: border-box;
            resize: vertical;
            font-size: 0.95rem;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        button.btn-main {
            width: 100%;
            background: linear-gradient(45deg, #0052d4, #4364f7, #6fb1fc);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }

        button.btn-main:hover {
            opacity: 0.9;
        }

        .results-grid {
            margin-top: 30px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .card {
            background: #0f172a;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-right: 4px solid var(--primary);
            border-top: 1px solid #334155;
        }

        .card-header {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .card-header img.thumb {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
        }

        .card-title {
            font-size: 0.95rem;
            line-height: 1.4;
            flex-grow: 1;
        }

        .actions-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-action {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
            flex: 1;
        }

        .btn-action:hover {
            background: #2563eb;
        }

        .btn-action.btn-preview {
            background: #334155;
            color: #f8fafc;
        }

        .btn-action.btn-preview:hover {
            background: #475569;
        }

        .btn-action.downloaded {
            background: #10b981 !important;
            cursor: default;
        }

        .images-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }

        .image-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #1e293b;
            padding: 8px;
            border-radius: 8px;
        }

        .image-item img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
        }

        .loader {
            display: none;
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
            color: var(--secondary);
        }

        /* نافذة المعاينة المكبرة (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 132, 255, 0.5);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 25px;
            color: #fff;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
        }

        video.preview-video {
            width: 100%;
            max-height: 350px;
            border-radius: 8px;
            margin-top: 10px;
            background: #000;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>تحميل فيديوهات وصور تيك توك</h1>
    <p class="subtitle">يمكنك تحميل حتى خمسه روابط في المره الواحده</p>

    <textarea id="linksInput" placeholder="ضع روابط التيك توك هنا...&#10;مثال:...https://vm.tiktok.com/"></textarea>
    
    <button class="btn-main" onclick="processLinks()">بدء التحليل والتحميل</button>

    <div class="loader" id="loader">جاري العثور على الفيديوهات والصور...</div>

    <div class="results-grid" id="results"></div>
</div>

<!-- Modal المعاينة -->
<div class="modal" id="imageModal" onclick="closeModal()">
    <span class="modal-close">&times;</span>
    <img class="modal-content" id="modalImage" src="" alt="معاينة المكبرة">
</div>

<script>
async function processLinks() {
    const input = document.getElementById('linksInput').value.trim();
    const resultsContainer = document.getElementById('results');
    const loader = document.getElementById('loader');

    if (!input) {
        alert('من فضلك ادخل رابط واحد على الأقل');
        return;
    }

    let links = input.split('\n').map(l => l.trim()).filter(l => l.length > 0);

    if (links.length > 5) {
        alert('تم تحديد أول 5 روابط فقط بناءً على الحد الأقصى');
        links = links.slice(0, 5);
    }

    resultsContainer.innerHTML = '';
    loader.style.display = 'block';

    for (let i = 0; i < links.length; i++) {
        await fetchTikTokData(links[i]);
    }

    loader.style.display = 'none';
}

async function fetchTikTokData(url) {
    const resultsContainer = document.getElementById('results');

    try {
        const response = await fetch('https://www.tikwm.com/api/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: new URLSearchParams({
                'url': url,
                'hd': 1
            })
        });

        const resData = await response.json();

        if (resData.code === 0 && resData.data) {
            const item = resData.data;
            const card = document.createElement('div');
            card.className = 'card';

            // إذا كان الرابط ألبوم صور
            if (item.images && item.images.length > 0) {
                let imagesHTML = '';
                item.images.forEach((imgUrl, index) => {
                    imagesHTML += `
                        <div class="image-item">
                            <img src="${imgUrl}" alt="صورة ${index + 1}" onclick="openModal('${imgUrl}')">
                            <button onclick="downloadImage('${imgUrl}', 'tiktok_image_${index + 1}.jpeg', this)" class="btn-action" style="font-size: 0.75rem; padding: 6px;">تنزيل مباشر</button>
                            <button onclick="openModal('${imgUrl}')" class="btn-action btn-preview" style="font-size: 0.75rem; padding: 4px;">🔍 معاينة</button>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="card-header">
                        <img class="thumb" src="${item.cover}" alt="غلاف" onclick="openModal('${item.cover}')">
                        <div class="card-title">
                            <strong>[ألبوم صور] (${item.images.length} صور)</strong><br>
                            ${item.title || 'بدون عنوان'}
                        </div>
                    </div>
                    <div><strong>اختر الصور للتحميل:</strong></div>
                    <div class="images-gallery">${imagesHTML}</div>
                `;
            } 
            // إذا كان الرابط فيديو عادي
            else {
                card.innerHTML = `
                    <div class="card-header">
                        <img class="thumb" src="${item.cover}" alt="غلاف">
                        <div class="card-title">
                            <strong>[فيديو]</strong><br>
                            ${item.title || 'بدون عنوان'}
                        </div>
                    </div>
                    <div class="actions-group">
                        <button onclick="downloadVideo('${item.play}', 'tiktok_video.mp4', this)" class="btn-action">⬇️ تنزيل الفيديو</button>
                        <button onclick="toggleVideoPreview(this, '${item.play}')" class="btn-action btn-preview">👁️ معاينة الفيديو</button>
                    </div>
                    <div class="video-container" style="display:none;"></div>
                `;
            }

            resultsContainer.appendChild(card);
        } else {
            showErrorCard(url, 'تعذر جلب البيانات، تأكد من صحة الرابط');
        }
    } catch (err) {
        showErrorCard(url, 'حدث خطأ أثناء الاتصال بالسيرفر');
    }
}

// تنزيل الصورة وتحديث الزرار لـ "تم التنزيل ✅"
async function downloadImage(fileUrl, fileName, btnElement) {
    btnElement.innerText = 'جاري التحميل... ⏳';
    btnElement.disabled = true;

    try {
        const response = await fetch(fileUrl);
        const blob = await response.blob();
        
        const blobUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = blobUrl;
        a.download = fileName;
        
        document.body.appendChild(a);
        a.click();
        
        window.URL.revokeObjectURL(blobUrl);
        document.body.removeChild(a);

        btnElement.innerText = 'تم التنزيل ✅';
        btnElement.classList.add('downloaded');
    } catch (error) {
        window.open(fileUrl, '_blank');
        btnElement.innerText = 'تم التنزيل ✅';
        btnElement.classList.add('downloaded');
    }
}

// تنزيل الفيديو
async function downloadVideo(fileUrl, fileName, btnElement) {
    const originalText = btnElement.innerText;
    btnElement.innerText = 'جاري التنزيل... ⏳';
    btnElement.disabled = true;

    try {
        const response = await fetch(fileUrl);
        const blob = await response.blob();
        
        const blobUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = blobUrl;
        a.download = fileName;
        
        document.body.appendChild(a);
        a.click();
        
        window.URL.revokeObjectURL(blobUrl);
        document.body.removeChild(a);

        btnElement.innerText = 'تم التنزيل بنجاح ✅';
        btnElement.classList.add('downloaded');
    } catch (error) {
        window.open(fileUrl, '_blank');
        btnElement.innerText = 'تم الفتح للتحميل ✅';
        btnElement.classList.add('downloaded');
    }
}

// فتح وإغلاق معاينة الفيديو
function toggleVideoPreview(btn, videoUrl) {
    const card = btn.closest('.card');
    const container = card.querySelector('.video-container');

    if (container.style.display === 'none') {
        container.innerHTML = `<video class="preview-video" controls autoplay src="${videoUrl}"></video>`;
        container.style.display = 'block';
        btn.innerText = '❌ إخفاء المعاينة';
    } else {
        container.innerHTML = '';
        container.style.display = 'none';
        btn.innerText = '👁️ معاينة الفيديو';
    }
}

// فتح وإغلاق Modal معاينة الصور
function openModal(imgUrl) {
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImage');
    modal.style.display = 'flex';
    modalImg.src = imgUrl;
}

function closeModal() {
    document.getElementById('imageModal').style.display = 'none';
}
</script>

</body>
</html>
