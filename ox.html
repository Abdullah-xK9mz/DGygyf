<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة إكس أو | تحدي الذكاء والتكتيك</title>
    <style>
        :root {
            --bg-color: #0b1329;
            --cell-bg: rgba(30, 41, 59, 0.7);
            --cell-hover: rgba(51, 65, 85, 0.9);
            --panel-line: rgba(71, 85, 105, 0.5);
            --cyan: #3ec9d6;
            --pink: #ff3d7f;
            --win: #52d17c;
            --text-color: #f8fafc;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 10% 10%, rgba(62,201,214,0.12), transparent 45%),
                radial-gradient(circle at 90% 90%, rgba(255,61,127,0.12), transparent 45%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* تحويل الصفحة كلها لتشمل اللعبة دون كارت محدد */
        .view-page {
            position: relative;
            width: 100%;
            max-width: 500px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .eyebrow {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--cyan);
            margin-bottom: 8px;
            font-weight: 600;
        }

        h1 {
            font-size: clamp(26px, 6vw, 36px);
            font-weight: 700;
            margin: 0 0 24px;
            text-align: center;
        }

        h1 span {
            color: var(--cyan);
        }

        .hud {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: space-between;
            margin-bottom: 25px;
            align-items: center;
            flex-wrap: wrap;
        }

        .stat-pill {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-line);
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            backdrop-filter: blur(5px);
        }

        .select-wrap select {
            background: rgba(30, 41, 59, 0.8);
            color: var(--text-color);
            border: 1px solid var(--panel-line);
            padding: 10px 14px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(5px);
        }

        .ox-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 380px;
            aspect-ratio: 1 / 1;
            margin-bottom: 25px;
        }

        .ox-cell {
            background: var(--cell-bg);
            border: 1px solid var(--panel-line);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
            backdrop-filter: blur(5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .ox-cell:hover {
            background: var(--cell-hover);
            border-color: var(--cyan);
            transform: translateY(-2px);
        }

        .ox-cell.x {
            color: var(--cyan);
        }

        .ox-cell.o {
            color: var(--pink);
        }

        .ox-cell.win {
            background: rgba(82,209,124,0.2);
            border-color: var(--win);
            color: var(--win);
        }

        .actions {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
        }

        .btn-nav-back {
            background: transparent;
            border: 1px solid var(--panel-line);
            color: var(--text-color);
            padding: 12px 22px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(5px);
        }

        .btn-nav-back:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--text-color);
        }

        .overlay-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(11, 19, 41, 0.8);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            text-align: center;
        }

        .overlay-modal h2 {
            font-size: 2.2rem;
            margin: 0 0 10px;
            color: var(--win);
        }

        .overlay-modal p {
            margin: 0 0 25px;
            color: #cbd5e1;
            font-size: 1.2rem;
        }

        .win-btn {
            background: var(--cyan);
            color: #0b1329;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .win-btn:hover {
            opacity: 0.95;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

  <div id="page-ox" class="view-page">
    <div id="ox-winOverlay" class="overlay-modal">
      <h2 id="ox-winTitle">🏆 الفائز!</h2>
      <p id="ox-winDesc">تهانينا على الأداء الممتاز</p>
      <button class="win-btn" onclick="resetOxGame()">جولة جديدة 🔄</button>
    </div>

    <div class="eyebrow">تحدي الذكاء والتكتيك</div>
    <h1>لعبة <span>إكس أو</span> ❌⭕</h1>

    <div class="hud">
      <div class="stat-pill stat-player">اللاعب (X): <b id="ox-score-x">0</b></div>
      <div class="stat-pill stat-comp">الخصم (O): <b id="ox-score-o">0</b></div>
      <div class="select-wrap">
        <select id="ox-mode" onchange="resetOxGame()">
          <option value="ai-easy">ضد الكمبيوتر (سهل) 🥱</option>
          <option value="ai-hard" selected>ضد الكمبيوتر (ذكي) 🧠</option>
          <option value="pvp">لاعبين (نفس الجهاز) 👥</option>
        </select>
      </div>
    </div>

    <div class="ox-grid" id="ox-grid"></div>

    <div class="actions">
      <button class="btn-nav-back" style="color:var(--cyan); border-color:var(--cyan);" onclick="resetOxGame()">جولة جديدة 🔄</button>
      <button class="btn-nav-back" onclick="alert('هذه هي القائمة الرئيسية (زر تجريبي)')">القائمة الرئيسية 📋</button>
    </div>
  </div>

  <script>
    /* ==================== 2. منطق لعبة إكس أو ==================== */
    let oxBoard = Array(9).fill(null), oxCurrentTurn = 'X', oxActive = true, oxScores = { X: 0, O: 0 };
    const oxWinPatterns = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    document.addEventListener('DOMContentLoaded', () => {
      resetOxGame();
    });

    function resetOxGame() {
      oxBoard = Array(9).fill(null); 
      oxCurrentTurn = 'X'; 
      oxActive = true;
      const grid = document.getElementById('ox-grid');
      grid.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const cell = document.createElement('div');
        cell.className = 'ox-cell';
        cell.addEventListener('click', () => handleOxCellClick(i));
        grid.appendChild(cell);
      }
      document.getElementById('ox-winOverlay').style.display = 'none';
    }

    function handleOxCellClick(index) {
      if (!oxActive || oxBoard[index]) return;
      makeOxMove(index, oxCurrentTurn);
      
      const mode = document.getElementById('ox-mode').value;
      if (oxActive && mode.startsWith('ai') && oxCurrentTurn === 'O') {
        setTimeout(makeAIMove, 300);
      }
    }

    function makeOxMove(index, player) {
      oxBoard[index] = player;
      const cells = document.getElementById('ox-grid').children;
      cells[index].innerText = player;
      cells[index].classList.add(player.toLowerCase());

      const winCombo = checkOxWin(player);
      if (winCombo) {
        oxActive = false;
        winCombo.forEach(i => cells[i].classList.add('win'));
        oxScores[player]++;
        document.getElementById(`ox-score-${player.toLowerCase()}`).innerText = oxScores[player];
        setTimeout(() => showOxWinner(player === 'X' ? 'اللاعب X فاز باللقب! 🏆' : 'اللاعب O فاز بالجولة! 🤖'), 500);
      } else if (oxBoard.every(c => c !== null)) {
        oxActive = false;
        setTimeout(() => showOxWinner('تعادل عادل! 🤝'), 400);
      } else {
        oxCurrentTurn = oxCurrentTurn === 'X' ? 'O' : 'X';
      }
    }

    function checkOxWin(player) {
      return oxWinPatterns.find(p => p.every(i => oxBoard[i] === player));
    }

    function showOxWinner(msg) {
      document.getElementById('ox-winTitle').innerText = msg;
      document.getElementById('ox-winOverlay').style.display = 'flex';
    }

    function makeAIMove() {
      const mode = document.getElementById('ox-mode').value;
      const emptyIndices = oxBoard.map((v, i) => v === null ? i : null).filter(v => v !== null);
      if (emptyIndices.length === 0) return;

      let move;
      if (mode === 'ai-easy') {
        move = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
      } else {
        move = findBestOxMove('O') ?? findBestOxMove('X') ?? (oxBoard[4] === null ? 4 : emptyIndices[Math.floor(Math.random() * emptyIndices.length)]);
      }
      makeOxMove(move, 'O');
    }

    function findBestOxMove(player) {
      for (let combo of oxWinPatterns) {
        const pCount = combo.filter(i => oxBoard[i] === player).length;
        const emptyCount = combo.filter(i => oxBoard[i] === null).length;
        const nullIdx = combo.find(i => oxBoard[i] === null);
        if (pCount === 2 && emptyCount === 1 && nullIdx !== undefined) {
          return nullIdx;
        }
      }
      return null;
    }
  </script>
</body>
</html>
